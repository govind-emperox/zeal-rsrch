name: zeal-rsrch

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "127.0.0.1:54320:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rsrch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rsrch}
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8"
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - rsrch_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

volumes:
  rsrch_postgres_data:
    name: zeal-rsrch-postgres-data
